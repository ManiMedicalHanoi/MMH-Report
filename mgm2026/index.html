function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function open(code){
  var S=crypto.subtle,E=new TextEncoder();
  return S.importKey("raw",E.encode(code),"PBKDF2",false,["deriveKey"]).then(function(k){
    return S.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})
  .then(function(k){return S.decrypt({name:"AES-GCM",iv:u8(D.iv)},k,u8(D.c))})
  .then(function(buf){return new TextDecoder().decode(buf)});
}
function mount(html){
  document.getElementById("lock").remove();
  var app=document.getElementById("app");app.innerHTML=html;
  app.querySelectorAll("link[rel=stylesheet],link[rel=preconnect]").forEach(function(l){document.head.appendChild(l)});
  app.querySelectorAll("script").forEach(function(o){var s=document.createElement("script");s.textContent=o.textContent;o.replaceWith(s)});
}
var saved=null;try{saved=localStorage.getItem("mgm26_pc")}catch(e){}
function ask(){document.getElementById("lock").hidden=false;setTimeout(function(){document.getElementById("pc").focus()},50)}
if(saved){open(saved).then(mount,function(){try{localStorage.removeItem("mgm26_pc")}catch(e){}ask()})}else ask();
document.getElementById("lf").addEventListener("submit",function(ev){ev.preventDefault();
  var v=document.getElementById("pc").value.trim(),er=document.getElementById("er");er.textContent="Đang mở…";
  open(v).then(function(h){try{localStorage.setItem("mgm26_pc",v)}catch(e){}mount(h)},function(){er.textContent="Mã chưa đúng, thử lại nhé."});
});
})();
</script>
