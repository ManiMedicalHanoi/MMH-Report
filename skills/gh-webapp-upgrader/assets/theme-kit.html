<!-- ══ THEME KIT (gh-webapp-upgrader) ═════════════════════════════════════════════════════════════
  CÀI ĐẶT:
  (1) Dán khối <style id="theme-css"> + <script> "đặt data-theme sớm" vào CUỐI <head> (trước khi trang vẽ ⇒ không nháy màu).
  (2) Dán nút vào thanh trên cùng (cạnh công tắc ngôn ngữ / avatar):
      <button class="th-btn" id="th-btn" type="button" onclick="THEME.toggle(event)" title="Màu giao diện">…svg…</button>
  (3) Dán khối <style id="theme-ui-css"> + <script> THEME ở cuối <body>.
  (4) CSS của app dùng biến: --t-pri --t-pri2 --t-ink --t-soft --t-line --t-bg (+ --brand-blue --brand-navy --blue-2
      --brand-navy2 --sky --lb1 --lb2 --lb3 --pale --gray nếu app có token cũ — đổi tên cho khớp app).
      Thay màu viết cứng: python3 scripts/recolor_css.py index.html --map '#3A5CAA=--t-pri' …
  Thêm tông: thêm 1 dòng html[data-theme="x"]{…} + 1 phần tử trong APP_THEMES (c: [pri, ink, line, gray] cho ô xem trước).
═══════════════════════════════════════════════════════════════════════════════════════════════ -->

<!-- (3) cuối <body> -->
<style id="theme-ui-css">
.th-btn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--t-pri);cursor:pointer}
.th-btn:hover{background:var(--t-soft);border-color:var(--t-line)}
.th-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.th-btn svg circle{fill:currentColor;stroke:none}
#th-pop{position:fixed;z-index:9000;width:min(452px,calc(100vw - 20px));background:#fff;border:1px solid #E6EAEF;border-radius:14px;box-shadow:0 12px 32px rgba(20,35,50,.12);padding:14px;font-family:Aptos,'Aptos Display','Segoe UI',Calibri,Arial,sans-serif;color:#1F3347;display:none}
#th-pop.show{display:block}
#th-pop .hd{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
#th-pop .hd b{font-size:14.5px;color:var(--t-ink)}
#th-pop .hd span{font-size:12px;color:#7A8999}
#th-pop .gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#th-pop button.op{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border:1px solid #E6EAEF;border-radius:11px;background:#fff;cursor:pointer;font-family:inherit;color:inherit}
#th-pop button.op:hover{border-color:#CBD3DC;background:#FAFBFC}
#th-pop button.op.on{border-color:var(--t-pri);box-shadow:0 0 0 1px var(--t-pri) inset}
#th-pop .sw{display:grid;grid-template-columns:1fr 1fr;width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.06)}
#th-pop .sw i{display:block}
#th-pop .tx{min-width:0;flex:1}
#th-pop .tx b{display:block;font-size:13px;font-weight:700}
#th-pop .tx small{display:block;font-size:11.5px;color:#7A8999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#th-pop .ck{width:18px;height:18px;border-radius:50%;flex:none;display:none;align-items:center;justify-content:center;background:var(--t-pri);color:#fff;font-size:11px;font-weight:800}
#th-pop button.op.on .ck{display:inline-flex}
#th-pop .ft{margin:10px 2px 0;font-size:11.5px;color:#7A8999}
@media(max-width:900px){ .th-btn{width:34px;height:34px} #th-pop .gr{grid-template-columns:1fr} }
</style>
<script>
(function(){
"use strict";
var KEY="app_theme", LIST=window.APP_THEMES||[];
function cur(){ var t=document.documentElement.getAttribute("data-theme"); return t||"base"; }
function esc(x){ return String(x).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var THEME=window.THEME={
  list:LIST, cur:cur,
  set:function(k){
    if(!LIST.some(function(t){ return t.k===k; })) k="base";
    if(k==="base") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",k);
    try{ localStorage.setItem(KEY,k); }catch(e){}
    var pop=document.getElementById("th-pop");
    if(pop) [].forEach.call(pop.querySelectorAll("button.op"),function(b){ b.classList.toggle("on",b.getAttribute("data-k")===k); });
  },
  build:function(){
    var pop=document.getElementById("th-pop"); if(pop) return pop;
    pop=document.createElement("div"); pop.id="th-pop"; pop.setAttribute("role","dialog");
    var c=cur();
    pop.innerHTML='<div class="hd"><b>Màu giao diện</b><span>Lưu riêng trên máy này</span></div><div class="gr">'
      +LIST.map(function(t){
        return '<button type="button" class="op'+(t.k===c?' on':'')+'" data-k="'+esc(t.k)+'" onclick="THEME.set(this.getAttribute(\'data-k\'))">'
          +'<span class="sw">'+t.c.map(function(x){ return '<i style="background:'+esc(x)+'"></i>'; }).join("")+'</span>'
          +'<span class="tx"><b>'+esc(t.n)+'</b><small>'+esc(t.d)+'</small></span><span class="ck">✓</span></button>';
      }).join("")+'</div><div class="ft">Đổi màu không ảnh hưởng dữ liệu; màu theo loại lịch / trạng thái giữ nguyên để dễ nhận biết.</div>';
    document.body.appendChild(pop);
    document.addEventListener("mousedown",function(e){ if(pop.classList.contains("show") && !pop.contains(e.target) && !e.target.closest("#th-btn")) THEME.close(); },true);
    document.addEventListener("keydown",function(e){ if(e.key==="Escape") THEME.close(); });
    window.addEventListener("resize",function(){ if(pop.classList.contains("show")) THEME.place(); });
    return pop;
  },
  place:function(){
    var pop=document.getElementById("th-pop"), b=document.getElementById("th-btn"); if(!pop||!b) return;
    var r=b.getBoundingClientRect(), w=pop.offsetWidth, vw=document.documentElement.clientWidth;
    pop.style.top=Math.round(r.bottom+8)+"px";
    pop.style.left=Math.round(Math.max(10,Math.min(vw-w-10,r.right-w)))+"px";
  },
  open:function(){ var pop=THEME.build(); pop.classList.add("show"); THEME.place(); },
  close:function(){ var pop=document.getElementById("th-pop"); if(pop) pop.classList.remove("show"); },
  toggle:function(e){ if(e) e.stopPropagation(); var pop=document.getElementById("th-pop"); if(pop&&pop.classList.contains("show")) THEME.close(); else THEME.open(); }
};
})();
</script>
